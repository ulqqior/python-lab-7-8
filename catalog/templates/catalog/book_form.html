<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати книгу — Онлайн-бібліотека</title>
</head>
<body>
    <h1>Додавання нової книги</h1>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Назва: <input type="text" name="title" required></label>
        <label>ISBN-13: <input type="text" name="isbn" required></label>
        <label>Автор ID: <input type="number" name="author_id" required></label>
        <label>Ціна: <input type="text" name="price" value="250.00"></label>
        <label>Сторінки: <input type="number" name="pages" value="200"></label>
        <label>Рік: <input type="number" name="published_year" value="2024"></label>
        <button type="submit">Зберегти</button>
    </form>
</body>
</html>
